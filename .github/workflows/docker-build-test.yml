name: Docker Build Test

on:
  workflow_dispatch:

jobs:
  test-builds:
    name: Test Docker Build - PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env file for testing
        run: |
          cp .env.example .env.docker
          sed -i "s/PHP_VERSION=8.1/PHP_VERSION=${{ matrix.php-version }}/" .env.docker

      - name: Build workspace container
        run: |
          docker compose --env-file .env.docker build workspace
        timeout-minutes: 30

      - name: Build php-fpm container
        run: |
          docker compose --env-file .env.docker build php-fpm
        timeout-minutes: 30

      - name: Build php-worker container
        run: |
          docker compose --env-file .env.docker build php-worker
        timeout-minutes: 30

      - name: Start containers
        run: |
          docker compose --env-file .env.docker up -d workspace php-fpm
        timeout-minutes: 10

      - name: Verify PHP version in workspace
        run: |
          docker compose --env-file .env.docker exec -T workspace php -v

      - name: Verify zip extension in workspace
        run: |
          docker compose --env-file .env.docker exec -T workspace php -m | grep zip

      - name: Verify PHP version in php-fpm
        run: |
          docker compose --env-file .env.docker exec -T php-fpm php -v

      - name: Verify zip extension in php-fpm
        run: |
          docker compose --env-file .env.docker exec -T php-fpm php -m | grep zip

      - name: Cleanup
        if: always()
        run: |
          docker compose --env-file .env.docker down -v
